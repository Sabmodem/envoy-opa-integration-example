version: '3.8'

services:
  envoy:
    image: envoyproxy/envoy:v1.28-latest
    container_name: envoy-gateway
    ports:
      - "8080:8080"  # API Gateway port
      - "9901:9901"  # Admin interface
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      - opa
    networks:
      - microservices-network

  opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: opa-server
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--config-file=/config/opa-config.yaml"
      - "/policies"
    volumes:
      - ./opa/config.yaml:/config/opa-config.yaml
      - ./opa/policies:/policies
    networks:
      - microservices-network

  # Простой тестовый сервис для проверки
  test-service:
    image: nginx:alpine
    container_name: service1
    ports:
      - "8081:80"
    volumes:
      - ./test-service/index.html:/usr/share/nginx/html/index.html
      - ./test-service/health:/usr/share/nginx/html/health
    networks:
      - microservices-network

volumes:
  consul_data:

networks:
  microservices-network:
    driver: bridge
