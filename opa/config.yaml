services:
  authz:
    addr: 0.0.0.0:9191
    query: data.envoy.authz.allow

plugins:
  envoy_ext_authz_grpc:
    addr: :9191
    query: data.envoy.authz.allow
    enable_reflection: true

decision_logs:
  console: true
  reporting:
    min_delay_seconds: 1
    max_delay_seconds: 5

status:
  console: false

# Принудительно включаем HTTP сервер
server:
  addr: 0.0.0.0:8181
